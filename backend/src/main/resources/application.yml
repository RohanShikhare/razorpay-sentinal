server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: razorpay-sentinel

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpay_sentinel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' is intentional while the schema is still taking shape
      # across components; revisit (e.g. a migration tool) once it stabilizes.
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

sentinel:
  cors:
    allowed-origins: ${SENTINEL_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  payments:
    # How far back synthetic payment timestamps are spread. Wide enough for
    # the incident detection engine to compute a meaningful baseline vs. current failure rate.
    generation-window-hours: ${SENTINEL_PAYMENT_GENERATION_WINDOW_HOURS:48}
  monitoring:
    default-window-minutes: ${SENTINEL_MONITORING_DEFAULT_WINDOW_MINUTES:60}
    minimum-sample-size: ${SENTINEL_MONITORING_MIN_SAMPLE_SIZE:100}
    minimum-segment-sample-size: ${SENTINEL_MONITORING_MIN_SEGMENT_SAMPLE_SIZE:15}
    max-window-minutes: ${SENTINEL_MONITORING_MAX_WINDOW_MINUTES:2880}
    thresholds:
      minimum-increase-points: ${SENTINEL_MONITORING_THRESHOLD_MINIMUM:5.0}
      low-increase-points: ${SENTINEL_MONITORING_THRESHOLD_LOW:5.0}
      medium-increase-points: ${SENTINEL_MONITORING_THRESHOLD_MEDIUM:12.0}
      high-increase-points: ${SENTINEL_MONITORING_THRESHOLD_HIGH:20.0}
      critical-increase-points: ${SENTINEL_MONITORING_THRESHOLD_CRITICAL:30.0}
  financial:
    # Illustrative recovery-rate assumptions per RecoverabilityLevel - see
    # RecoverabilityClassifier for which error codes map to which level, and
    # the README for the full formula this feeds into.
    recoverability-rates:
      HIGH_RECOVERABILITY: ${SENTINEL_RECOVERABILITY_HIGH:0.70}
      MEDIUM_RECOVERABILITY: ${SENTINEL_RECOVERABILITY_MEDIUM:0.35}
      LOW_RECOVERABILITY: ${SENTINEL_RECOVERABILITY_LOW:0.10}
      UNKNOWN: ${SENTINEL_RECOVERABILITY_UNKNOWN:0.25}
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-1.5-flash}
    temperature: ${AI_TEMPERATURE:0.2}
    timeout-ms: ${AI_TIMEOUT_MS:10000}

logging:
  level:
    com.sentinelpulse: INFO
